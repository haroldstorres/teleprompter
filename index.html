<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Teleprompter</title>
<style>
:root{--bg:#f4f3ef;--fg:#1c1b19;--card:#fff;--line:#d6d3cb;--acc:#b4540a;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--fg:#ece9e2;--card:#222126;--line:#3a3840;--acc:#f0a03c;--accfg:#1a1206}}
:root[data-theme="dark"]{--bg:#17161a;--fg:#ece9e2;--card:#222126;--line:#3a3840;--acc:#f0a03c;--accfg:#1a1206}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 "Avenir Next",-apple-system,"Segoe UI",system-ui,sans-serif}
#ed{display:flex;flex-direction:column;height:100%;gap:10px;padding:12px;box-sizing:border-box}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}
select,button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{flex:1;resize:none;font-size:17px;line-height:1.5}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700;padding:14px}
#pr{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#txt{position:relative;padding:35vh 6vw 60vh;font-weight:700;line-height:1.5;font-family:"Avenir Next",-apple-system,system-ui,sans-serif}
#txt.m{transform:scaleX(-1)}
.w{color:#f5f1e8;transition:color .25s}
.w.d{color:#5b5851}
.w.c{color:#ffb347}
#guide{position:absolute;left:0;right:0;top:35%;border-top:2px solid rgba(255,179,71,.45);pointer-events:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;background:rgba(0,0,0,.7);pointer-events:none}
#msg{position:absolute;top:8px;left:12px;right:12px;z-index:3;background:#3a1d0a;color:#ffd9b0;padding:10px 12px;border-radius:10px;display:none}
#bar{background:#141414;padding:8px 10px;display:grid;gap:8px}
#bar button,#bar select{background:#262626;color:#fff;border-color:#444;padding:10px}
#bar #pp{flex:1;background:#ffb347;color:#1a1206;border-color:#ffb347;font-weight:700}
#bar label{flex:1;display:flex;gap:8px;align-items:center;font-size:14px;color:#bbb}
#bar input{flex:1;min-width:0}
</style>
</head>
<body>
<div id="ed">
  <h1>Voice Teleprompter</h1>
  <div class="row"><select id="sel" style="flex:1;min-width:0"></select><button id="nw">New</button><button id="dl">Delete</button></div>
  <textarea id="ta" placeholder="Paste or type your script here…"></textarea>
  <button class="p" id="go">Open prompter</button>
</div>
<div id="pr">
  <div class="wrap">
    <div id="msg"></div>
    <div id="stage"><div id="txt"></div></div>
    <div id="guide"></div>
    <div id="cd"></div>
  </div>
  <div id="bar">
    <div class="row">
      <button id="rs" title="Back to start">⏮</button>
      <button id="pp">▶ Start</button>
      <button id="md"></button>
      <select id="lg"><option value="en-US">English</option><option value="fil-PH">Filipino / Taglish</option></select>
      <button id="mr" title="Mirror">⇋</button>
      <button id="ex" title="Close">✕</button>
    </div>
    <div class="row">
      <label>Size<input type="range" id="fs" min="24" max="90"></label>
      <label id="spl">Speed<input type="range" id="sp" min="10" max="150"></label>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SAMPLE='Magandang araw po sa inyong lahat.\n\nToday I want to share a short message about faithfulness. Kapag tayo ay tapat sa maliliit na bagay, mas pinagkakatiwalaan tayo sa malalaking bagay.\n\nSalamat po, and God bless!';
let S;try{S=JSON.parse(localStorage.getItem('tp1'))}catch(e){}
if(!S||!S.scripts||!S.scripts.length)S={scripts:[{id:1,text:SAMPLE}],cur:1,lang:'en-US',mode:'voice',fs:44,sp:40,mirror:false};
const save=()=>{try{localStorage.setItem('tp1',JSON.stringify(S))}catch(e){}};
const cur=()=>S.scripts.find(x=>x.id===S.cur)||S.scripts[0];
const label=x=>(x.text.trim().split('\n')[0]||'Untitled').slice(0,30);
function list(){S.cur=cur().id;$('#sel').innerHTML=S.scripts.map(x=>`<option value="${x.id}"${x.id===S.cur?' selected':''}>${esc(label(x))}</option>`).join('');$('#ta').value=cur().text}
$('#sel').onchange=e=>{S.cur=+e.target.value;list();save()};
$('#ta').oninput=e=>{cur().text=e.target.value;$('#sel').selectedOptions[0].textContent=label(cur());save()};
$('#nw').onclick=()=>{const id=Date.now();S.scripts.push({id,text:''});S.cur=id;list();save();$('#ta').focus()};
let dArm=0;
$('#dl').onclick=()=>{
  if(!dArm){dArm=1;$('#dl').textContent='Sure?';setTimeout(()=>{dArm=0;$('#dl').textContent='Delete'},3000);return}
  dArm=0;$('#dl').textContent='Delete';
  S.scripts=S.scripts.filter(x=>x.id!==S.cur);
  if(!S.scripts.length)S.scripts.push({id:Date.now(),text:''});
  S.cur=S.scripts[0].id;list();save();
};

/* Prompter */
let W=[],K=[],pos=0,run=false,armed=false,rec=null,y=0,raf=0,last=0,wl=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function sim(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return 1-p[n]/Math.max(m,n);
}
function build(){
  let h='',n=0;K=[];
  cur().text.split(/(\s+)/).forEach(p=>{
    if(!p)return;
    if(/^\s+$/.test(p)){const nl=(p.match(/\n/g)||[]).length;h+=nl?'<br>'.repeat(Math.min(2,nl)):' ';return}
    h+=`<span class="w" data-i="${n}">${esc(p)}</span>`;K.push(norm(p));n++;
  });
  $('#txt').innerHTML=h;W=[...document.querySelectorAll('.w')];pos=0;paint();$('#stage').scrollTop=0;
}
function paint(){W.forEach((el,i)=>{el.className='w'+(i<pos?' d':i===pos?' c':'')})}
function goto(p,smooth=true){
  pos=Math.max(0,Math.min(W.length,p));paint();
  const el=W[Math.min(pos,W.length-1)];if(!el)return;
  const st=$('#stage');st.scrollTo({top:el.offsetTop-st.clientHeight*.35,behavior:smooth?'smooth':'auto'});
}
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',5000)}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startVoice(){
  if(!SR){msg('Speech recognition isn’t available in this browser. Open this page in Safari, or switch to Scroll mode.');return false}
  rec=new SR();rec.lang=S.lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{
    if(!armed)return;
    // Build one transcript per alternative from the newest results, then keep the best match
    const from=Math.max(0,Math.min(e.resultIndex,e.results.length-2));
    let top=null;
    for(let a=0;a<3;a++){
      let tr='';
      for(let i=from;i<e.results.length;i++){const r=e.results[i];tr+=' '+(r[a]||r[0]).transcript}
      const m=findMatch(tr);
      if(m&&(!top||m.s>top.s))top=m;
    }
    if(top)goto(top.j+1);
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){msg('Microphone or speech access is blocked. Allow it in your browser or iOS settings, then try again.');stop()}
    else if(e.error==='network')msg('Speech recognition needs an internet connection.');
  };
  rec.onend=()=>{if(run&&S.mode==='voice')setTimeout(()=>{if(run&&S.mode==='voice')try{rec.start()}catch(e){}},150)};
  try{rec.start()}catch(e){}
  return true;
}
const STOP=new Set(['the','a','an','and','of','to','in','is','it','i','we','you','po','sa','na','ng','ay','at','ang','mga','ko','mo','ka','ba','pa','din','rin','si','ni','kay']);
// Word similarity; also accepts a partial word, since interim results often cut words short
function wsim(h,k){
  if(!h||!k)return 0;
  if(h.length>=3&&k.length>h.length&&k.startsWith(h))return .9;
  return sim(h,k);
}
// Find where the speaker is in the script. Returns {j,s} (index of the last word spoken) or null
function findMatch(tr){
  const h=tr.split(/\s+/).map(norm).filter(Boolean).slice(-6);if(!h.length)return null;
  let best=null;
  // Try the last 3 heard words as anchors, so one misheard word doesn't stall the highlight
  for(let back=0;back<Math.min(3,h.length);back++){
    const ai=h.length-1-back,hw=h[ai];
    for(let j=Math.max(0,pos-2);j<Math.min(K.length,pos+25);j++){
      if(!K[j])continue;
      const s0=wsim(hw,K[j]);if(s0<.75)continue;
      let ctx=0;
      for(let k=1;k<=2;k++){
        const x=h[ai-k];if(x===undefined)break;
        let b=0;for(let d=0;d<=1;d++){const y=K[j-k-d];if(y!==undefined)b=Math.max(b,wsim(x,y))}
        ctx+=b*.5;
      }
      const isStop=STOP.has(K[j])||K[j].length<3;
      // Short or common words only count with context, unless they are the very next word
      if(isStop&&ctx<.4&&j>pos)continue;
      const total=s0+ctx-Math.max(0,j-pos)*.01-back*.05;
      if(total<.8)continue;
      if(j+1<=pos)continue; // never move backwards
      if(!best||total>best.s)best={j,s:total};
    }
  }
  return best;
}
function tick(t){
  if(!run||S.mode!=='scroll'||!armed)return;
  const dt=Math.min(.1,(t-last)/1000);last=t;y+=S.sp*dt;
  const st=$('#stage');st.scrollTop=y;
  if(y>=st.scrollHeight-st.clientHeight-2){stop();return}
  raf=requestAnimationFrame(tick);
}
function countdown(cb){
  const st=$('#stage');let n=(pos===0&&st.scrollTop<5)?3:0;
  if(!n){cb();return}
  const c=$('#cd');c.style.display='flex';c.textContent=n;
  const t=setInterval(()=>{
    n--;
    if(!run){clearInterval(t);c.style.display='none';return}
    if(n<=0){clearInterval(t);c.style.display='none';cb()}else c.textContent=n;
  },1000);
}
async function wake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function play(){
  if(run)return;run=true;armed=false;
  if(S.mode==='voice'&&!startVoice()){run=false;return}
  ui();wake();
  countdown(()=>{armed=true;if(S.mode==='scroll'){y=$('#stage').scrollTop;last=performance.now();raf=requestAnimationFrame(tick)}});
}
function stop(){
  run=false;armed=false;try{rec&&rec.stop()}catch(e){}
  cancelAnimationFrame(raf);$('#cd').style.display='none';
  try{wl&&wl.release()}catch(e){}
  ui();
}
function ui(){
  $('#pp').textContent=run?'⏸ Pause':'▶ Start';
  $('#md').textContent=S.mode==='voice'?'🎙 Voice':'↕ Scroll';
  $('#lg').value=S.lang;$('#lg').style.display=S.mode==='voice'?'':'none';
  $('#spl').style.display=S.mode==='scroll'?'':'none';
  $('#txt').classList.toggle('m',S.mirror);$('#txt').style.fontSize=S.fs+'px';
  $('#fs').value=S.fs;$('#sp').value=S.sp;
}
$('#go').onclick=()=>{build();$('#pr').style.display='flex';ui()};
$('#ex').onclick=()=>{stop();$('#pr').style.display='none'};
$('#pp').onclick=()=>run?stop():play();
$('#rs').onclick=()=>{stop();pos=0;paint();$('#stage').scrollTo({top:0,behavior:'smooth'})};
$('#md').onclick=()=>{stop();S.mode=S.mode==='voice'?'scroll':'voice';save();ui()};
$('#lg').onchange=e=>{stop();S.lang=e.target.value;save()};
$('#mr').onclick=()=>{S.mirror=!S.mirror;save();ui()};
$('#fs').oninput=e=>{S.fs=+e.target.value;save();ui();goto(pos,false)};
$('#sp').oninput=e=>{S.sp=+e.target.value;save()};
$('#stage').addEventListener('touchstart',()=>{y=$('#stage').scrollTop},{passive:true});
$('#stage').addEventListener('click',e=>{const w=e.target.closest('.w');if(w)goto(+w.dataset.i)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run)stop()});
list();
</script>
</body>
</html>
